mc_fabric_heavy:
  attrs:
    description: "Fabric-heavy failures to stress intra-site topology differences"
  modes:
    # Fabric links
    - weight: 0.6
      rules:
        - scope: link
          mode: choice
          count: 16
          match:
            conditions:
              - { attr: link_type, op: "==", value: leaf_spine }
              - { attr: link_type, op: "==", value: intra_group }
              - { attr: link_type, op: "==", value: inter_group }
              - { attr: link_type, op: "==", value: internal_mesh }
            logic: or
    # Non-DC nodes, weighted by attached capacity
    - weight: 0.3
      rules:
        - scope: node
          mode: choice
          count: 2
          match:
            conditions:
              - { attr: node_type, op: "!=", value: dc_region }
            logic: and
          weight_by: attached_capacity_gbps
    # DC-to-PoP links
    - weight: 0.1
      rules:
        - scope: link
          mode: choice
          count: 2
          match:
            conditions:
              - { attr: link_type, op: "==", value: dc_to_pop }
            logic: and
          weight_by: target_capacity

fabric_only:
  attrs:
    description: "Fabric-only failures (no corridor SRLG/DC outages) for BAC sensitivity"
  modes:
    - weight: 1.0
      rules:
        - scope: link
          mode: choice
          count: 24
          match:
            conditions:
              - { attr: link_type, op: "==", value: leaf_spine }
              - { attr: link_type, op: "==", value: intra_group }
              - { attr: link_type, op: "==", value: inter_group }
              - { attr: link_type, op: "==", value: internal_mesh }
            logic: or
        - scope: node
          mode: choice
          count: 1
          match:
            conditions:
              - { attr: node_type, op: "!=", value: dc_region }
            logic: and
          weight_by: attached_capacity_gbps
