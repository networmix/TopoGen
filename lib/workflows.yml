    alpha_from_step: msd_sample_2
    alpha_from_field: data.alpha_star
  - type: MaximumSupportedDemand
    name: msd_sample_3
    demand_set: baseline_traffic_matrix_3
    alpha_start: 1.0
    growth_factor: 2.0
    alpha_min: 0.001
    alpha_max: 1000000.0
    resolution: 0.05
    max_bracket_iters: 16
    max_bisect_iters: 32
  - type: TrafficMatrixPlacement
