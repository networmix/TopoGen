[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netlab-topogen"
version = "0.6.0"
description = "Generate NetGraph backbone scenarios from US Census urban areas and TIGER/Line roads."
readme = "README.md"
authors = [{ name = "Andrey Golovanov" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "pyyaml",
    "numpy",
    "pandas",
    "matplotlib",
    # Geographic processing
    "pyproj",
    "geopandas",
    "shapely",
    "scipy",
    "networkx",
    "contextily",
    # Strict schema validation at runtime
    "jsonschema",
    # NetGraph ecosystem
    "ngraph>=0.25.0,<0.26",
]

# Dev / CI extras
[project.optional-dependencies]
dev = [
    # testing
    "pytest>=8",
    "pytest-cov",
    "pytest-timeout",
    # style + type checking
    "ruff==0.11.13",
    "pyright==1.1.401",
    # type stubs
    "pandas-stubs",
    # pre-commit hooks
    "pre-commit",
    # build and metadata checks
    "build",
    "twine",
]

[project.urls]
Repository = "https://github.com/networmix/NetLab-TopoGen"
Changelog = "https://github.com/networmix/NetLab-TopoGen/blob/main/CHANGELOG.md"
Issues = "https://github.com/networmix/NetLab-TopoGen/issues"

[project.scripts]
netlab-topogen = "netlab_topogen.cli:main"

# Pytest flags
[tool.pytest.ini_options]
addopts = "--cov=./netlab_topogen --cov-fail-under=50 --cov-report term-missing"
timeout = 30
markers = [
    "slow: marks integration tests as slow (deselect with '-m \"not slow\"')",
]

# Coverage configuration
[tool.coverage.run]
source = ["."]
omit = ["*/tests/*", "*/test_*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

# Package discovery
[tool.setuptools.packages.find]
include = ["netlab_topogen*"]

[tool.setuptools.package-data]
"netlab_topogen.schemas" = ["netlab_topogen_config.json"]
"netlab_topogen" = ["py.typed"]

# Ruff
[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "RUF100"] # core + Bugbear + isort + unused noqa
ignore = ["E501"]                          # allow long strings and comments
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["netlab_topogen"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

# Pyright / Pylance
[tool.pyright]
include = ["netlab_topogen"]
stubPath = "typings"
typeCheckingMode = "standard"
pythonVersion = "3.11"
venvPath = "."
venv = "venv"
exclude = [
    "tests/**",          # tests often use dynamic patterns
    "**/venv/**",        # virtual environments (generic)
    "**/*venv/**",       # virtual environments (various naming)
    "build/**",          # build artifacts
    "dist/**",           # distribution files
    "**/__pycache__/**", # Python cache files
    "**/*.egg-info/**",  # egg info directories
    "dev/**",            # developer scripts (not part of package)
]
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
